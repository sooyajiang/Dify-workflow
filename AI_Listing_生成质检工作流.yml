    - data:
        code: "import json\ndef main(body: str, status_code: int = 200) -> dict:\n    try:\n        d = json.loads(body)\n    except Exception:\n        return {\"comp_context\": f\"[竞品获取失败] HTTP {status_code}: {str(body)[:1500]}\\n请基于类目共识与用户输入生成, 并提示用户服务偶发超时, 可稍后重试.\"}\n    if status_code != 200 or d.get(\"error\"):\n        return {\"comp_context\": f\"[竞品获取失败] {d.get('error') or status_code}\\n请基于类目共识与用户输入生成, 并提示用户服务偶发超时, 可稍后重试.\"}\n    stats = d.get(\"stats\", {})\n    brands = d.get(\"brands\", [])\n    anomalies = d.get(\"anomalies\", [])\n    latest = (d.get(\"latest\") or [])[:10]\n    slim = {\n        \"stats\": stats,\n        \"brands\": brands,\n        \"anomalies\": anomalies,\n        \"latest\": [{\n            \"title\": i.get(\"title\"),\n            \"brand\": i.get(\"brand\"),\n            \"price\": i.get(\"price\"),\n            \"rating\": i.get(\"rating\"),\n            \"bsr\": i.get(\"bsr\"),\n        } for i in latest]\n    }\n    return {\"comp_context\": json.dumps(slim, ensure_ascii=False, indent=2)}\n"

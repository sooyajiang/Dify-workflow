          \   rounds = [(a1,b1),(a2,b2),(a3,b3)]\n    best = None\n    best_score\
          \ = -1\n    for a, b in rounds:\n        if not a and not b:\n         \
          \   continue\n        g = load(a)\n        passed, score, qd = qa(b)\n \
          \       if passed:\n            best = (g, qd)\n            break\n    \
          \    if score > best_score:\n            best_score = score\n          \
          \  best = (g, qd)\n    if best is None:\n        best = (load(a1), qa(b1)[2])\n\
          \    g, qd = best\n    out = [render(g)]\n    out.append(\"## 质检报告\")\n\
          \    out.append(f\"状态：{'✅ 合格，可发布' if qd.get('passed') else '❌ 不合格，需重写'}\"\
          )\n    out.append(f\"综合得分：{qd.get('score','N/A')}/10\")\n    out.append(f\"\
          硬门槛违规：{'有' if qd.get('hard_violation') else '无'}\")\n    out.append(\"\"\
          )\n    out.append(\"各维度评分：\")\n    for k, v in (qd.get('dimensions') or\
          \ {}).items():\n        out.append(f\"- {k}：{v}/10\")\n    issues = qd.get('issues')\
          \ or []\n    if issues:\n        out.append(\"\"); out.append(\"问题：\")\n\
          \        for i in issues: out.append(f\"- {i}\")\n    sugg = qd.get('suggestions')\
          \ or []\n    if sugg:\n        out.append(\"\"); out.append(\"优化建议：\")\n\
          \        for s in sugg: out.append(f\"- {s}\")\n    return {\"result\":\
          \ \"\\n\".join(out)}\n"

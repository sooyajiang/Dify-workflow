    - data:
        code: "import json, re\ndef clean(t):\n    t = re.sub(r'<think>.*?</think>',\
          \ '', t or '', flags=re.DOTALL)\n    t = re.sub(r'```json\\s*', '', t or\
          \ '', flags=re.IGNORECASE)\n    t = re.sub(r'\\s*```', '', t or '')\n  \
          \  s, e = (t or '').find('{'), (t or '').rfind('}')\n    if s != -1 and\
          \ e > s:\n        t = t[s:e+1]\n    return t\ndef main(qa: str) -> dict:\n\
          \    try:\n        d = json.loads(clean(qa))\n    except Exception:\n  \
          \      d = {}\n    passed = d.get('passed', False)\n    if isinstance(passed,\
          \ str):\n        passed = passed.lower() == 'true'\n    try:\n        score\
          \ = float(d.get('score', 0))\n    except Exception:\n        score = 0\n\
          \    issues = d.get('issues') or []\n    sugg = d.get('suggestions') or\
          \ []\n    return {\n        \"b_passed\": bool(passed),\n        \"b_score\"\
          : float(score),\n        \"b_issues\": \"\\n\".join(f\"- {i}\" for i in\
          \ issues) if issues else \"无\",\n        \"b_suggestions\": \"\\n\".join(f\"\
          - {s}\" for s in sugg) if sugg else \"无\"\n    }\n"

    - data:
        code: "import json, re\ndef clean(t):\n    t = re.sub(r'<think>.*?</think>', '', t or '', flags=re.DOTALL)\n    t = re.sub(r'```json\\s*', '', t or '', flags=re.IGNORECASE)\n    t = re.sub(r'\\s*```', '', t or '')\n    s, e = (t or '').find('{'), (t or '').rfind('}')\n    if s != -1 and e > s:\n        t = t[s:e+1]\n    return t\ndef load(t):\n    try:\n        return json.loads(clean(t))\n    except Exception:\n        return {}\ndef qa(t):\n    d = load(t)\n    passed = d.get('passed', False)\n    if isinstance(passed, str):\n        passed = passed.lower() == 'true'\n    try:\n        score = float(d.get('score', 0))\n    except Exception:\n        score = 0\n    return passed, score, d\ndef render(g):\n    parts = g.get(\"requested_parts\", []) or [\"title\",\"highlights\",\"bullets\",\"backend\"]\n    lines = [\"## 生成结果\"]\n    if \"title\" in parts and g.get(\"title\"):\n        tl = g.get(\"title_length\") or len(g.get(\"title\",\"\"))\n        comp = g.get(\"title_compliant\")\n        lines += [f\"标题：{g['title']}\", f\"标题长度：{tl}字符\", f\"标题合规：{'✅ 合规' if comp else '❌ 不合规'}\", \"\"]\n    if \"bullets\" in parts and g.get(\"bullets\"):\n        lines.append(\"五点描述：\")\n        for b in g[\"bullets\"]:\n            lines.append(f\"- {b}\")\n        lines.append(\"\")\n    if \"highlights\" in parts and g.get(\"highlights\"):\n        lines.append(\"Item Highlights：\")\n        for h in g[\"highlights\"]:\n            lines.append(f\"- {h}\")\n        lines.append(\"\")\n    if \"backend\" in parts and g.get(\"backend\"):\n        lines.append(\"后台搜索词：\")\n        for b in g[\"backend\"]:\n            lines.append(f\"- {b}\")\n        lines.append(\"\")\n    return \"\\n\".join(lines)\ndef main(a1,a2,b1,b2) -> dict:\n    rounds = [(a1,b1),(a2,b2)]\n    best = None\n    best_score = -1\n    for a, b in rounds:\n        if not a and not b:\n            continue\n        g = load(a)\n        if isinstance(g, dict):\n            t = g.get('title') or ''\n            if len(t) > 75:\n                cut = t[:75].rsplit(' ', 1)[0] if ' ' in t[:75] else t[:75]\n                g['title'] = cut; g['title_length'] = len(cut); g['title_compliant'] = True\n            g['highlights'] = [(h[:125]) for h in (g.get('highlights') or [])]\n            g['bullets'] = [(bb[:150].rsplit(' ', 1)[0] if len(bb) > 150 else bb) for bb in (g.get('bullets') or [])]\n        passed, score, qd = qa(b)\n        if isinstance(qd, dict):\n            _iss = qd.get('issues') or []\n            _kw = ['超长','150','75字符','125字符','>150','>75','>125','字符上限']\n            _kept = [i for i in _iss if not any(k in str(i) for k in _kw)]\n            if len(_kept) != len(_iss) and not _kept:\n                qd['passed'] = True; qd['hard_violation'] = False; qd['issues'] = ['无明显问题（长度类已自动校正）']\n            else:\n                qd['issues'] = _kept\n            passed = qd.get('passed', passed)\n\n        if passed:\n            best = (g, qd)\n            break\n        if score > best_score:\n            best_score = score\n            best = (g, qd)\n    if best is None:\n        g0 = load(a1)\n        if isinstance(g0, dict):\n            t0 = g0.get('title') or ''\n            if len(t0) > 75:\n                cut0 = t0[:75].rsplit(' ', 1)[0] if ' ' in t0[:75] else t0[:75]\n                g0['title'] = cut0; g0['title_length'] = len(cut0); g0['title_compliant'] = True\n            g0['highlights'] = [(h[:125]) for h in (g0.get('highlights') or [])]\n            g0['bullets'] = [(bb[:150].rsplit(' ', 1)[0] if len(bb) > 150 else bb) for bb in (g0.get('bullets') or [])]\n        qd0 = qa(b1)[2]\n        if isinstance(qd0, dict):\n            _iss = qd0.get('issues') or []\n            _kw = ['超长','150','75字符','125字符','>150','>75','>125','字符上限']\n            _kept = [i for i in _iss if not any(k in str(i) for k in _kw)]\n            if len(_kept) != len(_iss) and not _kept:\n                qd0['passed'] = True; qd0['hard_violation'] = False; qd0['issues'] = ['无明显问题（长度类已自动校正）']\n            else:\n                qd0['issues'] = _kept\n        best =\
          \ (g0, qd0)\n    g, qd = best\n    out = [render(g)]\n    out.append(\"## 质检报告\")\n    out.append(f\"状态：{'✅ 合格，可发布' if qd.get('passed') else '❌ 不合格，需重写'}\")\n    out.append(f\"综合得分：{qd.get('score','N/A')}/10\")\n    out.append(f\"硬门槛违规：{'有' if qd.get('hard_violation') else '无'}\")\n    out.append(\"\")\n    out.append(\"各维度评分：\")\n    for k, v in (qd.get('dimensions') or {}).items():\n        out.append(f\"- {k}：{v}/10\")\n    issues = qd.get('issues') or []\n    if issues:\n        out.append(\"\"); out.append(\"问题：\")\n        for i in issues: out.append(f\"- {i}\")\n    sugg = qd.get('suggestions') or []\n    if sugg:\n        out.append(\"\"); out.append(\"优化建议：\")\n        for s in sugg: out.append(f\"- {s}\")\n    return {\"result\": \"\\n\".join(out)}\n"
